<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background with subtle squircle padding for maskable safety -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- TV Monitor Screen Bezel in safe zone -->
  <rect x="96" y="110" width="320" height="230" rx="36" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="12" />
  
  <!-- Video Play Triangle -->
  <polygon points="225,185 315,225 225,265" fill="#ffffff" />
  
  <!-- SmartCast Waves in bottom left of TV -->
  <path d="M 125 310 A 20 20 0 0 1 145 330" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 125 285 A 45 45 0 0 1 170 330" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 125 260 A 70 70 0 0 1 195 330" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  
  <!-- Stand & Base -->
  <path d="M 220 340 L 292 340 L 305 380 L 207 380 Z" fill="#4338ca" />
  <rect x="180" y="380" width="152" height="16" rx="8" fill="#6366f1" />
</svg>
